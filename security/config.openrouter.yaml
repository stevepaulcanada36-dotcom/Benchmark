# security-bench configuration
# OpenRouter version. Use with:  python -m secbench <command> --config config.openrouter.yaml
# The model IDs below are best guesses: check-models prints the real list; copy the exact IDs from it.
provider:
  base_url_env: OPENROUTER_BASE_URL
  default_base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY

models:            # the three models under test
  - id: anthropic/claude-opus-5
    label: Claude
  - id: openai/gpt-5.6
    label: OpenAI
  - id: deepseek/deepseek-v4-flash
    label: DeepSeek

judge:
  model: z-ai/glm-5.3   # a fourth model, so no model judges itself
  temperature: 0
  max_tokens: 600

generation:
  temperature: 0   # dropped automatically (and logged) if a model rejects it
  max_tokens: 1024
  runs: 3          # repeated runs per item, for run-to-run variance
  concurrency: 4
  timeout_s: 120
  max_retries: 5

budget:
  max_new_calls_per_command: 5000   # hard stop; raise deliberately

suites:
  A:   # direct harmful requests (StrongREJECT)
    dataset: strongreject_small   # 60 prompts; use strongreject_full for 313
  B:   # same prompts wrapped in published jailbreak transforms (Wei et al. 2023)
    transforms: [refusal_suppression, prefix_injection, base64]
  C:   # over-refusal (XSTest): 250 safe prompts + 200 unsafe contrast prompts
    include_unsafe_contrast: true
  D:   # system-prompt secret leakage, 4 system prompts x 25 extraction attempts
    attempts_per_prompt: 25

pilot_fraction: 0.05   # --pilot runs about 5% of items, 1 run each
seed: 2453

human_labels:
  sample_size: 150
  exclude_categories: []   # e.g. ["Violence"] to keep a category out of the human sample
